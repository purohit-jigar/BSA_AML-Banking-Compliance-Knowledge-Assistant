[project]
name = "bsa-aml-assistant"
version = "0.1.0"
description = "Citation-grounded RAG assistant over public BSA/AML guidance"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "pydantic>=2.7",
  "pymupdf>=2.1",
  "lxml>=6.1.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsa_aml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
